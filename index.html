<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google Tag Manager: each approved hostname loads its own container. Production reports to the live GA4 container; staging loads a separate test container so dataLayer events can be verified in Tag Assistant without touching production data. Any other host (localhost, Vercel previews) loads nothing. -->
    <script>
      (function (w, d, s, l) {
        var GTM_CONTAINERS = {
          "www.evolvestrength.ca": "GTM-WMVH3DX8",
          "evolve-strength-staging.vercel.app": "GTM-TSZWK6VF",
        };
        var i = GTM_CONTAINERS[w.location.hostname];
        if (!i) return;
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer");
    </script>
    <!-- End Google Tag Manager -->
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/x-icon"
      href="/src/assets/icons/Evolve-Favicon-Less-Circular.ico"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Discover's Services card background images used to be preloaded
         here for every route (including Presale Park Royal, which never
         uses them) - removed since DiscoverServices.jsx already preloads
         them itself via new Image() when that page mounts. -->
    <!-- HubSpot Tracking Code -->
    <script
      type="text/javascript"
      id="hs-script-loader"
      async
      defer
      src="//js.hs-scripts.com/342148198.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
